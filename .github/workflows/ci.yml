name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the examples and the player
        run: python build/build.py examples/starter examples/pneumatic-slide examples/s3-side-table --player
      - name: Tests (node + Python)
        run: node tests/run.js
      - name: Headless page checks
        run: |
          python tools/headless.py dist/starter.html
          python tools/headless.py dist/pneumatic-slide.html
          python tools/headless.py dist/s3-side-table.html --wait 30000
          (cd dist && python -m http.server 8765 --bind 127.0.0.1 &) ; sleep 2
          python tools/headless.py "http://127.0.0.1:8765/player.html?project=starter.playground.json"
      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/index.html site/
          cp dist/*.html dist/*.playground.json dist/projects.json site/
          rm -f site/*.artifact.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
